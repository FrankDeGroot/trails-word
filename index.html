<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Finder</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #f4f4f6;
      --bg-secondary: #fff;
      --bg-tertiary: #fafafa;
      --bg-accent: #f0f0ff;
      --bg-filled: #ede9fe;
      --text-primary: #222;
      --text-secondary: #1a1a2e;
      --text-muted: #888;
      --text-light: #666;
      --text-tag: #333;
      --text-filled: #4338ca;
      --border-light: #ddd;
      --border-neutral: #e0e0e8;
      --border-accent: #a5b4fc;
      --border-index: #aaa;
      --accent-color: #6366f1;
      --shadow: rgba(0,0,0,.08);
      --transition: .15s;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #1a1a2e;
        --bg-secondary: #2d2d3d;
        --bg-tertiary: #3a3a4a;
        --bg-accent: #4a3f7f;
        --bg-filled: #5a4f9f;
        --text-primary: #e8e8f0;
        --text-secondary: #f0f0f8;
        --text-muted: #aaa;
        --text-light: #999;
        --text-tag: #ddd;
        --text-filled: #c4b5fd;
        --border-light: #555;
        --border-neutral: #4a4a5a;
        --border-accent: #7c3aed;
        --border-index: #666;
        --shadow: rgba(0,0,0,.3);
      }
    }

    /* Forced dark — overrides media query */
    html.dark-mode {
      --bg-primary: #1a1a2e;
      --bg-secondary: #2d2d3d;
      --bg-tertiary: #3a3a4a;
      --bg-accent: #4a3f7f;
      --bg-filled: #5a4f9f;
      --text-primary: #e8e8f0;
      --text-secondary: #f0f0f8;
      --text-muted: #aaa;
      --text-light: #999;
      --text-tag: #ddd;
      --text-filled: #c4b5fd;
      --border-light: #555;
      --border-neutral: #4a4a5a;
      --border-accent: #7c3aed;
      --border-index: #666;
      --shadow: rgba(0,0,0,.3);
    }

    /* Forced light — overrides media query */
    html.light-mode {
      --bg-primary: #f4f4f6;
      --bg-secondary: #fff;
      --bg-tertiary: #fafafa;
      --bg-accent: #f0f0ff;
      --bg-filled: #ede9fe;
      --text-primary: #222;
      --text-secondary: #1a1a2e;
      --text-muted: #888;
      --text-light: #666;
      --text-tag: #333;
      --text-filled: #4338ca;
      --border-light: #ddd;
      --border-neutral: #e0e0e8;
      --border-accent: #a5b4fc;
      --border-index: #aaa;
      --shadow: rgba(0,0,0,.08);
    }

    body {
      font-family: system-ui, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 2rem 1rem;
      transition: background .3s, color .3s;
    }

    .theme-toggle {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border-light);
      border-radius: 8px;
      padding: .5rem .75rem;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2.5rem;
      height: 2.5rem;
      transition: background .3s, border-color .3s;
      box-shadow: 0 2px 4px var(--shadow);
    }
    .theme-toggle:hover { background: var(--bg-accent); }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 1.5rem;
      color: var(--text-secondary);
    }

    .controls {
      background: var(--bg-secondary);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 2px 8px var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      max-width: 800px;
      transition: background .3s;
    }

    .field label {
      display: block;
      font-size: .8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--text-light);
      margin-bottom: .4rem;
    }

    #letters-input {
      font-size: 1.1rem;
      padding: .45rem .7rem;
      border: 2px solid var(--border-light);
      border-radius: 8px;
      width: 100%;
      max-width: 320px;
      outline: none;
      transition: border-color var(--transition), background .3s, color .3s;
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }
    #letters-input:focus { border-color: var(--accent-color); }

    .slider-row {
      display: flex;
      align-items: center;
      gap: .75rem;
    }

    #length-slider {
      flex: 1;
      max-width: 280px;
      accent-color: var(--accent-color);
      cursor: pointer;
    }

    #length-display {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent-color);
      min-width: 2ch;
      text-align: center;
    }

    #position-filters {
      display: flex;
      flex-wrap: wrap;
      gap: .35rem;
    }

    .pos-input {
      width: 2.2rem;
      height: 2.4rem;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 600;
      border: 2px solid var(--border-light);
      border-radius: 6px;
      outline: none;
      text-transform: lowercase;
      transition: border-color var(--transition), background var(--transition), color .3s;
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }
    .pos-input:focus { border-color: var(--accent-color); background: var(--bg-accent); }
    .pos-input.filled { border-color: var(--accent-color); background: var(--bg-filled); color: var(--text-filled); }

    .pos-index {
      width: 2.2rem;
      text-align: center;
      font-size: .65rem;
      color: var(--border-index);
      margin-top: .15rem;
    }

    .pos-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #status {
      font-size: .85rem;
      color: var(--text-muted);
      min-height: 1.2em;
    }

    #results {
      margin-top: 1.5rem;
      max-width: 800px;
    }

    #results-count {
      font-size: .85rem;
      color: var(--text-muted);
      margin-bottom: .75rem;
    }

    #words-container {
      display: flex;
      flex-wrap: wrap;
      gap: .4rem;
    }

    .word-tag {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border-neutral);
      border-radius: 6px;
      padding: .2rem .5rem;
      font-size: .95rem;
      font-family: 'Courier New', monospace;
      color: var(--text-tag);
      transition: background .1s, border-color .1s, opacity .1s;
      cursor: pointer;
      user-select: none;
      position: relative;
    }
    .word-tag:hover { background: var(--bg-accent); border-color: var(--border-accent); }
    .word-tag.dimmed { opacity: .25; }

    .word-text {
      line-height: 1.2;
    }

    .word-delete-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1rem;
      height: 1rem;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: .85rem;
      line-height: 1;
      cursor: pointer;
      opacity: 0;
      transition: opacity .15s, background .15s, color .15s, transform .1s;
      padding: 0;
      margin-left: 0.15rem;
    }
    .word-tag:hover .word-delete-btn,
    .word-tag:focus-within .word-delete-btn {
      opacity: 0.7;
    }
    .word-delete-btn:hover {
      opacity: 1 !important;
      background: #ef4444;
      color: #fff;
      transform: scale(1.15);
    }

    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border-neutral);
      border-radius: 8px;
      padding: .6rem 1rem;
      font-size: .85rem;
      box-shadow: 0 4px 12px var(--shadow);
      transition: opacity .25s, transform .25s;
      z-index: 1000;
    }
    .toast.hidden {
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
    }
    .toast.error {
      border-color: #ef4444;
      color: #ef4444;
    }
    .toast.success {
      border-color: #10b981;
      color: #10b981;
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  <h1>Word Finder</h1>

  <div class="controls">
    <div class="field">
      <label for="letters-input">Available letters</label>
      <input id="letters-input" type="text" placeholder="e.g. wordtrails" autocomplete="off" spellcheck="false" autocapitalize="none">
    </div>

    <div class="field">
      <label>Word length</label>
      <div class="slider-row">
        <input id="length-slider" type="range" min="3" max="30" value="3">
        <span id="length-display">3</span>
      </div>
    </div>

    <div class="field">
      <label>Position filter <span style="font-weight:400;text-transform:none;letter-spacing:0">(leave blank to match any)</span></label>
      <div id="position-filters"></div>
    </div>

    <div id="status">Loading word list…</div>
  </div>

  <div id="results">
    <div id="results-count"></div>
    <div id="words-container"></div>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script>
    // ── Theme toggle logic ──────────────────────────────────────────
    const themeToggle = document.getElementById('theme-toggle');
    const html = document.documentElement;
    const THEME_KEY = 'word-finder-theme';

    const THEMES = [
      { key: 'system', icon: '🌓', title: 'System theme — switch to dark' },
      { key: 'dark',   icon: '🌙', title: 'Dark mode — switch to light' },
      { key: 'light',  icon: '☀️', title: 'Light mode — switch to system' },
    ];

    function applyTheme(key) {
      html.classList.toggle('dark-mode',  key === 'dark');
      html.classList.toggle('light-mode', key === 'light');
      html.style.colorScheme = key === 'dark' ? 'dark' : key === 'light' ? 'light' : 'light dark';
      const t = THEMES.find(t => t.key === key);
      themeToggle.textContent = t.icon;
      themeToggle.title = t.title;
      themeToggle.setAttribute('aria-label', t.title);
    }

    function initTheme() {
      applyTheme(localStorage.getItem(THEME_KEY) || 'system');
    }

    themeToggle.addEventListener('click', () => {
      const current = localStorage.getItem(THEME_KEY) || 'system';
      const idx = THEMES.findIndex(t => t.key === current);
      const next = THEMES[(idx + 1) % THEMES.length].key;
      localStorage.setItem(THEME_KEY, next);
      applyTheme(next);
    });

    initTheme();

    const LETTERS_KEY   = 'word-finder-letters';
    const LENGTH_KEY    = 'word-finder-length';
    const POSITIONS_KEY = 'word-finder-positions';

    const MAX_DISPLAY = 500;

    let allWords = [];
    const dimmedWords = new Set();
    let ready = false;

    const lettersInput  = document.getElementById('letters-input');
    const lengthSlider  = document.getElementById('length-slider');
    const lengthDisplay = document.getElementById('length-display');
    const posFilters    = document.getElementById('position-filters');
    const statusEl      = document.getElementById('status');
    const countEl       = document.getElementById('results-count');
    const wordsEl       = document.getElementById('words-container');
    const toastEl       = document.getElementById('toast');

    let toastTimer = null;
    function showToast(message, type = '', duration = 3000) {
      if (!toastEl) return;
      clearTimeout(toastTimer);
      toastEl.textContent = message;
      toastEl.className = 'toast' + (type ? ` ${type}` : '');
      toastTimer = setTimeout(() => {
        toastEl.classList.add('hidden');
      }, duration);
    }

    // ── Load word list (API with fallback) ──────────────────────────
    async function initWordList() {
      statusEl.textContent = 'Loading word list…';
      let text = null;
      let source = '';

      try {
        const apiRes = await fetch('/api/words');
        if (apiRes.ok) {
          text = await apiRes.text();
          source = 'api';
        }
      } catch (_) {
        // API not available, fall back to static text file
      }

      if (!text) {
        try {
          const staticRes = await fetch('word_trails.txt');
          if (staticRes.ok) {
            text = await staticRes.text();
            source = 'local';
          }
        } catch (_) {
          // both failed
        }
      }

      if (!text) {
        statusEl.textContent = 'Failed to load word list – ensure API or word_trails.txt is accessible.';
        return;
      }

      allWords = text.split('\n').map(w => w.trim()).filter(Boolean);
      ready = true;

      const restoredLength = lettersInput.value.trim().toLowerCase().replace(/[^a-z]/g, '').length;
      if (restoredLength > 0) {
        const max = Math.max(restoredLength, 3);
        lengthSlider.max = max;
        const savedLength = parseInt(localStorage.getItem(LENGTH_KEY), 10);
        const length = (savedLength >= 3 && savedLength <= max) ? savedLength : max;
        lengthSlider.value = length;
        lengthDisplay.textContent = length;
      }
      buildPositionInputs(+lengthSlider.value);
      runFilter();
    }

    initWordList();

    // ── Position inputs ─────────────────────────────────────────────
    function buildPositionInputs(n) {
      const prev = [...posFilters.querySelectorAll('.pos-input')].map(el => el.value);
      const stored = prev.some(v => v) ? [] : JSON.parse(localStorage.getItem(`${POSITIONS_KEY}-${n}`) || '[]');
      posFilters.innerHTML = '';
      for (let i = 0; i < n; i++) {
        const cell = document.createElement('div');
        cell.className = 'pos-cell';

        const inp = document.createElement('input');
        inp.type = 'text';
        inp.maxLength = 1;
        inp.className = 'pos-input';
        inp.dataset.index = i;
        inp.value = prev[i] || stored[i] || '';
        inp.autocapitalize = 'none';
        inp.autocomplete = 'off';
        inp.spellcheck = false;
        if (inp.value) inp.classList.add('filled');

        inp.addEventListener('focus', () => inp.select());
        inp.addEventListener('input', () => {
          const rawLetters = lettersInput.value.trim().toLowerCase().replace(/[^a-z]/g, '');
          const ch = inp.value.toLowerCase().replace(/[^a-z]/g, '').slice(-1);
          inp.value = (ch && rawLetters && !rawLetters.includes(ch)) ? '' : ch;
          inp.classList.toggle('filled', inp.value !== '');
          savePositions();
          dimmedWords.clear();
          runFilter();
          // auto-advance
          if (inp.value) {
            const next = posFilters.querySelector(`.pos-input[data-index="${i + 1}"]`);
            if (next) next.focus();
          }
        });

        inp.addEventListener('keydown', e => {
          if (e.key === 'Backspace' && inp.value === '') {
            const prev = posFilters.querySelector(`.pos-input[data-index="${i - 1}"]`);
            if (prev) { prev.focus(); prev.value = ''; prev.classList.remove('filled'); savePositions(); dimmedWords.clear(); runFilter(); }
          } else if (e.key === 'ArrowLeft') {
            const p = posFilters.querySelector(`.pos-input[data-index="${i - 1}"]`);
            if (p) p.focus();
          } else if (e.key === 'ArrowRight') {
            const nx = posFilters.querySelector(`.pos-input[data-index="${i + 1}"]`);
            if (nx) nx.focus();
          }
        });

        const idx = document.createElement('div');
        idx.className = 'pos-index';
        idx.textContent = i + 1;

        cell.append(inp, idx);
        posFilters.append(cell);
      }
    }

    function savePositions() {
      const n = +lengthSlider.value;
      const values = [...posFilters.querySelectorAll('.pos-input')].map(el => el.value);
      localStorage.setItem(`${POSITIONS_KEY}-${n}`, JSON.stringify(values));
    }

    function resetPositionFilters(n) {
      posFilters.querySelectorAll('.pos-input').forEach(el => {
        el.value = '';
        el.classList.remove('filled');
      });
      localStorage.setItem(`${POSITIONS_KEY}-${n}`, JSON.stringify([]));
      buildPositionInputs(n);
    }

    // ── Filter logic ────────────────────────────────────────────────
    function letterCounts(str) {
      const c = {};
      for (const ch of str) c[ch] = (c[ch] || 0) + 1;
      return c;
    }

    function fitsInBag(word, bag) {
      const wc = letterCounts(word);
      for (const ch of Object.keys(wc)) {
        if ((wc[ch] || 0) > (bag[ch] || 0)) return false;
      }
      return true;
    }

    // ── Word Deletion Logic ─────────────────────────────────────────
    async function deleteWord(w) {
      const idx = allWords.indexOf(w);
      if (idx === -1) return;

      // Optimistic removal from active state
      allWords.splice(idx, 1);
      dimmedWords.delete(w);
      runFilter();
      showToast(`Deleting "${w}"…`);

      try {
        const res = await fetch('/api/words', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ word: w })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error || errData.message || `Server returned ${res.status}`);
        }

        const data = await res.json().catch(() => ({}));
        showToast(data.message || `Deleted "${w}" successfully.`, 'success');
      } catch (err) {
        // Rollback on failure
        allWords.splice(idx, 0, w);
        runFilter();
        showToast(`Failed to delete "${w}": ${err.message}`, 'error', 4000);
      }
    }

    function runFilter() {
      if (!ready) return;

      const length     = +lengthSlider.value;
      const rawLetters = lettersInput.value.trim().toLowerCase().replace(/[^a-z]/g, '');
      const bag        = rawLetters ? letterCounts(rawLetters) : null;
      const pattern    = [...posFilters.querySelectorAll('.pos-input')].map(el => el.value.toLowerCase());

      if (!rawLetters) {
        statusEl.textContent = `${allWords.length.toLocaleString()} words loaded`;
        countEl.textContent = '';
        wordsEl.innerHTML = '';
        return;
      }

      const matched = [];
      for (const word of allWords) {
        if (word.length !== length) continue;
        // position filter
        let ok = true;
        for (let i = 0; i < pattern.length; i++) {
          if (pattern[i] && word[i] !== pattern[i]) { ok = false; break; }
        }
        if (!ok) continue;
        // bag filter (only when letters provided)
        if (bag && !fitsInBag(word, bag)) continue;
        matched.push(word);
      }

      const total = matched.length;
      statusEl.textContent = total === 0
        ? 'No matches'
        : `${total.toLocaleString()} match${total === 1 ? '' : 'es'}${total > MAX_DISPLAY ? ` — showing first ${MAX_DISPLAY}` : ''}`;
      countEl.textContent = '';

      wordsEl.innerHTML = '';
      const frag = document.createDocumentFragment();
      for (const w of matched.slice(0, MAX_DISPLAY)) {
        const span = document.createElement('span');
        span.className = 'word-tag';
        if (dimmedWords.has(w)) span.classList.add('dimmed');

        const textSpan = document.createElement('span');
        textSpan.className = 'word-text';
        textSpan.textContent = w;

        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'word-delete-btn';
        delBtn.title = `Delete "${w}" from word list`;
        delBtn.setAttribute('aria-label', `Delete "${w}" from word list`);
        delBtn.innerHTML = '&times;';

        delBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          deleteWord(w);
        });

        span.addEventListener('click', () => {
          if (dimmedWords.has(w)) { dimmedWords.delete(w); span.classList.remove('dimmed'); }
          else                    { dimmedWords.add(w);    span.classList.add('dimmed'); }
        });

        span.append(textSpan, delBtn);
        frag.append(span);
      }
      wordsEl.append(frag);
    }

    // ── Event wiring ────────────────────────────────────────────────
    lengthSlider.addEventListener('input', () => {
      const n = +lengthSlider.value;
      localStorage.setItem(LENGTH_KEY, n);
      lengthDisplay.textContent = n;
      dimmedWords.clear();
      resetPositionFilters(n);
      runFilter();
    });

    lettersInput.value = localStorage.getItem(LETTERS_KEY) || '';

    lettersInput.addEventListener('focus', () => {
      lettersInput.select();
    });

    lettersInput.addEventListener('input', () => {
      localStorage.setItem(LETTERS_KEY, lettersInput.value);
      const rawLetters = lettersInput.value.trim().toLowerCase().replace(/[^a-z]/g, '');
      const letterCount = rawLetters.length;

      if (letterCount > 0) {
        const max = Math.max(letterCount, 3);
        lengthSlider.max = max;
        lengthSlider.value = max;
        lengthDisplay.textContent = max;
      } else {
        lengthSlider.max = 30;
      }

      dimmedWords.clear();
      resetPositionFilters(+lengthSlider.value);
      runFilter();
    });
  </script>
</body>
</html>
